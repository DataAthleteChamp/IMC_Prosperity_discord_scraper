[project]
name = "imc-prosperity-discord-scraper"
version = "0.1.0"
description = "Open-source scraper for IMC Prosperity Discord discussions"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jakub Piotrowski" }]
requires-python = ">=3.11"
keywords = ["discord", "scraper", "imc-prosperity", "archive", "dataset", "llm", "jsonl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Utilities",
    "Typing :: Typed",
]

dependencies = [
    "httpx>=0.27",
    "aiolimiter>=1.1",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "orjson>=3.10",
    "keyring>=25",
    "click>=8.1",
    "rich>=13.7",
]

[project.optional-dependencies]
bot  = ["discord.py>=2.4"]
user = ["discord.py-self>=2.1"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "types-orjson",
]

[project.scripts]
prosperity-scraper = "scraper.cli:main"

[project.urls]
Repository = "https://github.com/DataAthleteChamp/IMC_Prosperity_discord_scraper"
Issues     = "https://github.com/DataAthleteChamp/IMC_Prosperity_discord_scraper/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scraper"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF", "PT", "PERF", "C4"]
ignore = ["B008"]  # click decorators are call-in-default

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SIM", "PT011"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
check_untyped_defs = true
disallow_incomplete_defs = true
ignore_missing_imports = true
files = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["src/scraper"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
