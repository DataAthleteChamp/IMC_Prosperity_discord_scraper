name: Feature request
description: Suggest a new capability.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      description: |
        This project's goal is a reliable archival scraper. Features whose
        only purpose is to evade Discord detection are explicitly out of scope.
      options:
        - label: "This feature is not solely for evading ToS enforcement."
          required: true
